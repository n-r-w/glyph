edition = "2023";

package glyph.plugins.extension.v1;

import "api/plugins/extension/v1/session_entry.proto";

option go_package = "github.com/n-r-w/glyph/pkg/plugins/extension/v1;extensionv1";

// WireHeaders contains public headers with ordered values per name.
message WireHeaders {
  // Header names are case-insensitive; authentication and account headers are private.
  map<string, WireHeaderValues> entries = 1;
}

// WireHeaderValues contains all values of one header.
message WireHeaderValues {
  // Values retain the order for this header name.
  repeated string values = 1;
}

// ProviderHeadersInvocation supplies detached immutable original and composed current headers.
message ProviderHeadersInvocation {
  // The immutable original public headers.
  WireHeaders original = 1;
  // The public headers produced by preceding handlers.
  WireHeaders current = 2;
}

// ProviderHeadersAction preserves the current headers or replaces all public headers.
message ProviderHeadersAction {
  // The handler must select one valid action.
  oneof action {
    // True preserves current headers; false is invalid.
    bool preserve = 1;
    // The complete replacement public headers.
    WireHeaders replace = 2;
  }
}

// ProviderBodyInvocation supplies safe JSON with invocation-local private replay references.
// A retained reference restores its private fragment; removing it discards that fragment.
// Unknown, altered, duplicated, or misplaced references fail before provider dispatch.
message ProviderBodyInvocation {
  // The immutable original safe JSON.
  bytes original = 1;
  // The safe JSON produced by preceding handlers.
  bytes current = 2;
}

// ProviderBodyAction preserves the current safe JSON or replaces it.
message ProviderBodyAction {
  // The handler must select one valid action.
  oneof action {
    // True preserves current JSON; false is invalid.
    bool preserve = 1;
    // The complete replacement safe JSON object.
    bytes replace = 2;
  }
}

// ProviderResponseInvocation exposes response status and public headers before stream consumption.
message ProviderResponseInvocation {
  // The provider response status before decoding or stream consumption.
  int64 status = 1;
  // Public response headers with private values excluded or redacted.
  WireHeaders headers = 2;
}

// ProviderResponseAction acknowledges observation without changing the response.
message ProviderResponseAction {
  // True acknowledges observation; false is invalid.
  bool acknowledge = 1;
}

// SystemInstructionsInvocation supplies the immutable original and composed current system instructions.
message SystemInstructionsInvocation {
  // The immutable instructions of the prepared model request.
  string original = 1;
  // The instructions produced by preceding handlers.
  string current = 2;
}

// SystemInstructionsAction preserves the current instructions or replaces them.
message SystemInstructionsAction {
  // The handler must select one valid action.
  oneof action {
    // True preserves current instructions; false is invalid.
    bool preserve = 1;
    // The complete replacement instructions.
    string replace = 2;
  }
}

// ModelContextInvocation supplies request-local history with invocation-local private replay references.
// A retained reference restores its private replay; removing it discards that replay.
// Unknown, altered, duplicated, or misplaced references fail the handler.
message ModelContextInvocation {
  // The immutable history of the prepared model request.
  ModelContextHistory original = 1;
  // The history produced by preceding handlers.
  ModelContextHistory current = 2;
}

// ModelContextAction preserves the current history or replaces it for this model request only.
message ModelContextAction {
  // The handler must select one valid action.
  oneof action {
    // True preserves current history; false is invalid.
    bool preserve = 1;
    // The complete replacement history.
    ModelContextHistory replace = 2;
  }
}

// ModelContextHistory contains ordered provider-neutral history entries.
message ModelContextHistory {
  // The entries in model request order.
  repeated ModelContextEntry entries = 1;
}

// ModelContextEntry contains one user message, model response, or tool result.
message ModelContextEntry {
  // Exactly one entry payload is required.
  oneof content {
    // One user message.
    SessionTreeUserMessage user = 1;
    // One model response with private replay references.
    ReplayableModelResponse model = 2;
    // One terminal tool result.
    SessionTreeToolResult tool_result = 3;
  }
}

// ReplayableModelResponse contains ordered model-visible content with private replay references.
message ReplayableModelResponse {
  // The ordered response blocks.
  repeated ReplayableModelContent content = 1;
}

// ReplayableModelContent contains one model-visible block and an optional private replay reference.
message ReplayableModelContent {
  // The model-visible block.
  SessionTreeModelContent content = 1;
  // The invocation-local reference to private replay owned by reasoning content; empty when absent.
  string replay_reference = 2;
}

// UserInputInvocation supplies the immutable original and composed current user input of one accepted run.
message UserInputInvocation {
  // The immutable user input submitted by the client.
  SessionTreeUserMessage original = 1;
  // The user input produced by preceding handlers.
  SessionTreeUserMessage current = 2;
}

// UserInputAction preserves the current input, replaces it, or fully handles it.
message UserInputAction {
  // The handler must select one valid action.
  oneof action {
    // True preserves current input; false is invalid.
    bool preserve = 1;
    // The complete replacement input with at least one block; each text block is nonempty
    // and each image has a media type and data.
    SessionTreeUserMessage replace = 2;
    // True completes the request without an agent run and skips later input handlers; false is invalid.
    bool handle = 3;
  }
}
