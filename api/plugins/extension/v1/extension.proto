edition = "2023";

package glyph.plugins.extension.v1;

import "api/operation/v1/operation.proto";
import "api/plugins/extension/v1/lifecycle.proto";
import "api/plugins/extension/v1/model.proto";
import "api/plugins/extension/v1/session.proto";
import "api/plugins/extension/v1/session_tree.proto";
import "api/plugins/extension/v1/tool.proto";

option go_package = "github.com/n-r-w/glyph/pkg/plugins/extension/v1;extensionv1";

// ExtensionService exposes one bidirectional extension operation stream.
service ExtensionService {
  // Open exchanges operation requests and lifecycle events for both initiators.
  rpc Open(stream OpenRequest) returns (stream OpenResponse);
}

// OpenRequest carries Host output for either initiator namespace or connection close.
message OpenRequest {
  // The Host request identifier, or extension request identifier for a HostEvent.
  string operation_id = 1;
  // The stream content.
  oneof content {
    HostRequest request = 2;
    glyph.operation.v1.CloseConnection close = 3;
    HostEvent event = 4;
  }
}

// OpenResponse carries extension output for either initiator namespace.
message OpenResponse {
  // The extension request identifier, or Host request identifier for an ExtensionEvent.
  string operation_id = 1;
  // The stream content.
  oneof content {
    ExtensionEvent event = 2;
    ExtensionRequest request = 3;
  }
}

// HostRequest carries exactly one Host-initiated operation kind.
message HostRequest {
  // The operation request.
  oneof request {
    RegisterRequest register = 1;
    HandleRequest handle = 2;
    ExecuteRequest execute = 3;
    glyph.operation.v1.CancelOperation cancel = 4;
  }
}

// ExtensionEvent carries one lifecycle event for a Host-initiated operation.
message ExtensionEvent {
  // The lifecycle event.
  oneof event {
    glyph.operation.v1.Accepted accepted = 1;
    glyph.operation.v1.Running running = 2;
    ExtensionProgress progress = 3;
    ExtensionCompleted completed = 4;
    glyph.operation.v1.Canceled canceled = 5;
    glyph.operation.v1.Failed failed = 6;
    glyph.operation.v1.Rejected rejected = 7;
  }
}

// ExtensionProgress carries one operation-specific progress payload.
message ExtensionProgress {
  // The progress payload.
  oneof progress {
    ToolProgress tool = 1;
  }
}

// ExtensionCompleted carries one operation-specific completed payload.
message ExtensionCompleted {
  // The completed payload.
  oneof completed {
    RegisterResponse register = 1;
    HandleResponse handle = 2;
    ToolResult tool = 3;
    glyph.operation.v1.CancelCompleted cancel = 4;
  }
}

// ExtensionRequest carries one extension-initiated operation owned by Host.
message ExtensionRequest {
  // The request payload.
  oneof request {
    GetModelsRequest get_models = 1;
    GetProvidersRequest get_providers = 2;
    glyph.operation.v1.CancelOperation cancel = 3;
    ConfiguredModelRequest configured_model = 4;
    AppendExtensionRequest append_extension = 5;
    GetSessionStateRequest get_session_state = 6;
    AppendExtensionMessageRequest append_extension_message = 7;
  }
}

// HostEvent carries the lifecycle of one extension-initiated operation.
message HostEvent {
  // The lifecycle payload.
  oneof event {
    glyph.operation.v1.Accepted accepted = 1;
    glyph.operation.v1.Running running = 2;
    HostCompleted completed = 3;
    glyph.operation.v1.Canceled canceled = 4;
    glyph.operation.v1.Failed failed = 5;
    glyph.operation.v1.Rejected rejected = 6;
  }
}

// HostCompleted carries one extension-initiated Host result.
message HostCompleted {
  // The completed result.
  oneof completed {
    GetModelsResult get_models = 1;
    GetProvidersResult get_providers = 2;
    glyph.operation.v1.CancelCompleted cancel = 3;
    ConfiguredModelResult configured_model = 4;
    AppendExtensionResult append_extension = 5;
    GetSessionStateResult get_session_state = 6;
    AppendExtensionMessageResult append_extension_message = 7;
  }
}

// HandlerDescriptor registers one implemented extension handler.
message HandlerDescriptor {
  // The extension-local handler identifier.
  string id = 1;
  // The closed handler kind.
  HandlerKind kind = 2;
}

// HandlerKind identifies an implemented extension point.
enum HandlerKind {
  // No handler kind was provided.
  HANDLER_KIND_UNSPECIFIED = 0;
  // The handler transforms navigation requests and optional summary results.
  HANDLER_KIND_SESSION_BEFORE_TREE_REQUEST = 1;
  // The handler transforms completed branch-summary results.
  HANDLER_KIND_SESSION_BEFORE_TREE_RESULT = 2;
  // The handler observes committed tree navigation.
  HANDLER_KIND_SESSION_TREE = 3;
  // The handler observes agent start.
  HANDLER_KIND_AGENT_START = 4;
  // The handler observes agent end.
  HANDLER_KIND_AGENT_END = 5;
  // The handler observes Host settlement.
  HANDLER_KIND_AGENT_SETTLED = 6;
  // The handler observes turn start.
  HANDLER_KIND_TURN_START = 7;
  // The handler observes turn end.
  HANDLER_KIND_TURN_END = 8;
  // The handler observes message start.
  HANDLER_KIND_MESSAGE_START = 9;
  // The handler observes message updates.
  HANDLER_KIND_MESSAGE_UPDATE = 10;
  // The handler observes message end.
  HANDLER_KIND_MESSAGE_END = 11;
  // The handler observes tool execution start.
  HANDLER_KIND_TOOL_EXECUTION_START = 12;
  // The handler observes tool execution updates.
  HANDLER_KIND_TOOL_EXECUTION_UPDATE = 13;
  // The handler observes tool execution end.
  HANDLER_KIND_TOOL_EXECUTION_END = 14;
}

// RegisterRequest has no fields because registration is fixed at startup.
message RegisterRequest {}

// RegisterResponse contains the complete registration for one extension.
message RegisterResponse {
  // The complete ordered tool catalog.
  repeated ToolDescriptor tools = 1;
  // The complete ordered session-tree handler catalog.
  repeated HandlerDescriptor handlers = 2;
}
