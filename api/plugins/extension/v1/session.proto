edition = "2023";

package glyph.plugins.extension.v1;

import "api/plugins/extension/v1/context.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/n-r-w/glyph/pkg/plugins/extension/v1;extensionv1";

// AppendExtensionRequest appends one model-hidden extension-owned JSON value.
message AppendExtensionRequest {
  // The issued runtime-to-session binding.
  ExtensionContextRef context = 1;
  // The extension-defined entry kind.
  string entry_type = 2;
  // The exact extension-owned JSON value bytes.
  bytes data = 3;
}

// AppendExtensionResult contains the committed model-hidden entry.
message AppendExtensionResult {
  // The committed entry with Host-owned identity and metadata.
  SessionStateEntry entry = 1;
}

// AppendExtensionMessageRequest appends one model-visible extension-owned text message.
message AppendExtensionMessageRequest {
  // The issued runtime-to-session binding.
  ExtensionContextRef context = 1;
  // The extension-defined entry kind.
  string entry_type = 2;
  // The exact model-visible text.
  string text = 3;
  // The ordinary client transcript visibility.
  ClientVisibility visibility = 4;
}

// AppendExtensionMessageResult contains the committed message and post-commit delivery issues.
message AppendExtensionMessageResult {
  // The committed entry with Host-owned identity and metadata.
  SessionStateEntry entry = 1;
  // Delivery issues that did not roll back the committed entry.
  repeated AppendExtensionMessageIssue issues = 2;
}

// AppendExtensionMessageIssue reports one post-commit client delivery failure.
message AppendExtensionMessageIssue {
  // The closed issue code.
  AppendExtensionMessageIssueCode code = 1;
  // The complete issue text, including the original cause.
  string message = 2;
  // The extension that owns the failed append.
  string extension_id = 3;
}

// GetSessionStateRequest requests the caller extension's active-branch entries.
message GetSessionStateRequest {
  // The issued runtime-to-session binding.
  ExtensionContextRef context = 1;
}

// GetSessionStateResult contains one coherent active-branch snapshot.
message GetSessionStateResult {
  // The bound durable session identifier.
  string session_id = 1;
  // The active leaf identifier when the session tree is not empty.
  string active_leaf_id = 2;
  // The caller extension's entries in root-first active-branch order.
  repeated SessionStateEntry entries = 3;
}

// SessionStateEntry contains one stored extension entry without rewritten ancestry.
message SessionStateEntry {
  // The Host-owned entry identifier.
  string id = 1;
  // The stored parent identifier when the entry is not a root.
  string parent_id = 2;
  // The stored creation time.
  google.protobuf.Timestamp created_time = 3;
  // The owning extension identifier.
  string extension_id = 4;
  // The extension-defined entry kind.
  string entry_type = 5;
  // The typed extension content.
  oneof content {
    bytes data = 6;
    ExtensionMessage message = 7;
  }
}

// ExtensionMessage contains exact model-visible text and client visibility.
message ExtensionMessage {
  // The exact model-visible text.
  string text = 1;
  // The ordinary client transcript visibility.
  ClientVisibility visibility = 2;
}

// ClientVisibility controls ordinary client transcript presentation.
enum ClientVisibility {
  // No visibility was provided.
  CLIENT_VISIBILITY_UNSPECIFIED = 0;
  // The message is included in ordinary client transcripts.
  CLIENT_VISIBILITY_VISIBLE = 1;
  // The message is excluded from ordinary client transcripts.
  CLIENT_VISIBILITY_HIDDEN = 2;
}

// AppendExtensionMessageIssueCode identifies one post-commit issue.
enum AppendExtensionMessageIssueCode {
  // No issue code was provided.
  APPEND_EXTENSION_MESSAGE_ISSUE_CODE_UNSPECIFIED = 0;
  // Client publication failed after the message committed.
  APPEND_EXTENSION_MESSAGE_ISSUE_CODE_DELIVERY_FAILED = 1;
}
