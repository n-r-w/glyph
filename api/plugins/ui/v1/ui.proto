edition = "2023";

package glyph.plugins.ui.v1;

import "api/operation/v1/operation.proto";
import "api/plugins/ui/v1/agent.proto";
import "api/plugins/ui/v1/model.proto";
import "api/plugins/ui/v1/session.proto";

option go_package = "github.com/n-r-w/glyph/pkg/plugins/ui/v1;uiv1";

// UIService exposes one bidirectional UI operation stream.
service UIService {
  // Open exchanges Host requests and events with UI requests and events.
  rpc Open(stream OpenRequest) returns (stream OpenResponse);
}

// OpenRequest carries one Host request, event, connection event, or close request.
message OpenRequest {
  // The operation identifier for requests and operation events.
  string operation_id = 1;
  // The stream content.
  oneof content {
    HostRequest request = 2;
    HostEvent event = 3;
    HostConnectionEvent connection_event = 4;
    glyph.operation.v1.CloseConnection close = 5;
  }
}

// HostRequest carries exactly one Host-initiated operation kind.
message HostRequest {
  // The operation request.
  oneof request {
    Initialization initialize = 1;
    glyph.operation.v1.CancelOperation cancel = 2;
  }
}

// HostEvent carries one lifecycle event for a UI-initiated operation.
message HostEvent {
  // The lifecycle event.
  oneof event {
    glyph.operation.v1.Accepted accepted = 1;
    glyph.operation.v1.Running running = 2;
    HostProgress progress = 3;
    HostCompleted completed = 4;
    glyph.operation.v1.Canceled canceled = 5;
    glyph.operation.v1.Failed failed = 6;
    glyph.operation.v1.Rejected rejected = 7;
  }
}

// HostProgress carries one operation-specific progress payload.
message HostProgress {
  // The progress payload.
  oneof progress {
    AgentEvent agent_event = 1;
    AuthorizationRequest authorization = 2;
  }
}

// HostCompleted carries one operation-specific completed payload.
message HostCompleted {
  // The completed payload.
  oneof completed {
    glyph.operation.v1.CancelCompleted cancel = 1;
    SubmitCompleted submit = 2;
    AuthenticationCompleted authentication = 3;
    ModelSelectionChanged model_selection = 4;
    SessionChanged session_changed = 5;
    SessionList session_list = 6;
    SessionInformation session_information = 7;
    SessionTreeResult session_tree = 8;
    SessionTreeNavigationResult session_tree_navigation = 9;
    SessionForked session_forked = 10;
    SessionCloned session_cloned = 11;
    EntryLabelSet entry_label_set = 12;
  }
}

// SubmitCompleted acknowledges a completed submit operation.
message SubmitCompleted {}

// Initialization is the first frame and describes resolved startup state.
message Initialization {
  // The configured identifier of the selected UI plugin.
  string selected_ui_id = 1;
  // The ordered startup messages collected before UI initialization.
  repeated StartupContent startup_content = 2;
  // The extensions available to the Host.
  repeated ExtensionAvailability extensions = 3;
  // The Host availability at initialization time.
  Availability availability = 4;
  // The configured models in Host catalogue order.
  repeated ConfiguredModel models = 5;
  // The active Host-confirmed model selection.
  ModelSelection model_selection = 6;
  // The empty process-active session.
  SessionInfo session_info = 7;
}

// StartupContent carries one informational, warning, or error startup item.
message StartupContent {
  // The severity used to present this startup item.
  ContentSeverity severity = 1;
  // The user-visible startup item text.
  string text = 2;
}

// ContentSeverity identifies startup content importance.
enum ContentSeverity {
  // No content severity was provided.
  CONTENT_SEVERITY_UNSPECIFIED = 0;
  // The content is informational.
  CONTENT_SEVERITY_INFORMATION = 1;
  // The content reports an error.
  CONTENT_SEVERITY_ERROR = 2;
  // The content reports a warning.
  CONTENT_SEVERITY_WARNING = 3;
}

// Information carries one user-visible Host notification.
message Information {
  // The user-visible informational text.
  string text = 1;
}

// HostConnectionEvent carries Host information outside an operation lifecycle.
message HostConnectionEvent {
  // The connection event.
  oneof event {
    Information information = 1;
    Error error = 2;
    AvailabilityChanged availability_changed = 3;
  }
}

// Error carries one classified Host connection failure.
message Error {
  // The stable machine-readable Glyph category.
  string code = 1;
  // The complete user-visible error text.
  string text = 2;
}

// AvailabilityChanged reports the current Host availability.
message AvailabilityChanged {
  // The current Host availability.
  Availability availability = 1;
}

// OpenResponse carries one UI request, event, or close request.
message OpenResponse {
  // The operation identifier for requests and operation events.
  string operation_id = 1;
  // The stream content.
  oneof content {
    UIRequest request = 2;
    UIEvent event = 3;
    glyph.operation.v1.CloseConnection close = 4;
  }
}

// UIRequest carries exactly one UI-initiated operation kind.
message UIRequest {
  // The operation request.
  oneof request {
    SubmitCommand submit = 1;
    glyph.operation.v1.CancelOperation cancel = 2;
    RetryAuthenticationCommand retry_authentication = 3;
    SelectModelCommand select_model = 4;
    SelectReasoningChoiceCommand select_reasoning_choice = 5;
    CreateSessionCommand create_session = 6;
    ListSessionsCommand list_sessions = 7;
    ResumeSessionCommand resume_session = 8;
    SetSessionNameCommand set_session_name = 9;
    GetSessionInfoCommand get_session_info = 10;
    GetSessionTreeCommand get_session_tree = 11;
    NavigateSessionTreeCommand navigate_session_tree = 12;
    ForkSessionCommand fork_session = 13;
    CloneSessionCommand clone_session = 14;
    SetEntryLabelCommand set_entry_label = 15;
  }
}

// UIEvent carries one lifecycle event for a Host-initiated operation.
message UIEvent {
  // The lifecycle event.
  oneof event {
    glyph.operation.v1.Accepted accepted = 1;
    glyph.operation.v1.Running running = 2;
    UICompleted completed = 3;
    glyph.operation.v1.Canceled canceled = 4;
    glyph.operation.v1.Failed failed = 5;
    glyph.operation.v1.Rejected rejected = 6;
  }
}

// UICompleted carries one operation-specific completed payload.
message UICompleted {
  // The completed payload.
  oneof completed {
    Initialized initialized = 1;
    glyph.operation.v1.CancelCompleted cancel = 2;
  }
}

// Initialized acknowledges completed UI initialization.
message Initialized {}

// SubmitCommand requests one user turn.
message SubmitCommand {
  // The user request submitted to the Host.
  string text = 1;
}
