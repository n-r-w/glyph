syntax = "proto3";

package glyph.plugins.ui.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/n-r-w/glyph/pkg/plugins/ui/v1;uiv1";

// UIService exposes fixed startup capabilities and one UI lifecycle stream.
service UIService {
  // GetCapabilities returns immutable capabilities without opening the UI stream.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  // Open carries ordered Host frames and UI commands for one application lifecycle.
  rpc Open(stream OpenRequest) returns (stream OpenResponse);
}

// GetCapabilitiesRequest has no fields because capabilities are fixed at startup.
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse declares immutable UI process capabilities.
message GetCapabilitiesResponse {
  // Whether the UI process owns terminal input and output.
  optional bool controls_terminal = 1;
}

// OpenRequest carries exactly one Host-to-UI payload.
message OpenRequest {
  // The Host frame payload.
  oneof content {
    Initialization initialization = 1;
    LifecycleEvent lifecycle = 2;
    AuthorizationRequest authorization = 3;
    Information information = 4;
    Error error = 5;
    ModelSelectionChanged model_selection_changed = 6;
    SessionList session_list = 7;
    SessionChanged session_changed = 8;
    SessionInformation session_information = 9;
    SessionTreeResult session_tree = 10;
    SessionTreeNavigationResult session_tree_navigation = 11;
    SessionTreeFailed session_tree_failed = 12;
    SessionForked session_forked = 13;
    SessionCloned session_cloned = 14;
    EntryLabelSet entry_label_set = 15;
  }
}

// Initialization is the first frame and describes resolved startup state.
message Initialization {
  // The configured identifier of the selected UI plugin.
  optional string selected_ui_id = 1;
  // The ordered startup messages collected before UI initialization.
  repeated StartupContent startup_content = 2;
  // The extensions available to the Host.
  repeated ExtensionAvailability extensions = 3;
  // The Host availability at initialization time.
  optional Availability availability = 4;
  // The configured models in Host catalogue order.
  repeated ConfiguredModel models = 5;
  // The active Host-confirmed model selection.
  ModelSelection model_selection = 6;
  // The empty process-active session.
  SessionInfo session_info = 7;
}

// ConfiguredModel describes one selectable model and its reasoning choices.
message ConfiguredModel {
  // The configured provider instance identifier.
  optional string provider_id = 1;
  // The configured model identifier.
  optional string model_id = 2;
  // The model reasoning capabilities.
  ReasoningCapabilities reasoning = 3;
}

// ReasoningCapabilities describes one model reasoning contract.
message ReasoningCapabilities {
  // Whether the model can produce reasoning.
  optional bool supported = 1;
  // The effective choices in configured order.
  repeated ReasoningChoice choices = 2;
  // The model default choice.
  optional ReasoningChoice default_choice = 3;
}

// ModelSelection identifies the Host-confirmed active selection.
message ModelSelection {
  // The configured provider instance identifier.
  optional string provider_id = 1;
  // The configured model identifier.
  optional string model_id = 2;
  // The active reasoning choice.
  optional ReasoningChoice reasoning_choice = 3;
}

// ModelSelectionChanged confirms one selection committed by the Host.
message ModelSelectionChanged {
  // The committed model selection.
  ModelSelection selection = 1;
}

// SessionInfo contains lifecycle information for one session.
message SessionInfo {
  // The opaque session identifier.
  optional string id = 1;
  // The user-assigned name when present.
  optional string name = 2;
  // The canonical project working directory.
  optional string working_directory = 3;
  // The persisted JSONL path when present.
  optional string storage_path = 4;
  // The session creation time.
  google.protobuf.Timestamp created_time = 5;
  // The most recent stored update time.
  google.protobuf.Timestamp update_time = 6;
}

// SessionSummary contains one stored session selector row.
message SessionSummary {
  // The session lifecycle information.
  SessionInfo info = 1;
  // The first public user text when present.
  optional string first_user_text = 2;
  // The number of stored public messages.
  optional int64 total_messages = 3;
}

// SessionList carries ordered stored-session summaries.
message SessionList {
  // The stored sessions in Host list order.
  repeated SessionSummary sessions = 1;
}

// SessionChanged replaces the active session identity and transcript.
message SessionChanged {
  // The replacement active-session information.
  SessionInfo info = 1;
  // The complete replacement transcript in stored order.
  repeated SessionEntry entries = 2;
}

// SessionForked contains the replacement session and exact editable input.
message SessionForked {
  // The replacement active session.
  SessionChanged session = 1;
  // The exact selected user text.
  optional string next_input = 2;
}

// SessionCloned contains the replacement active session.
message SessionCloned {
  // The replacement active session.
  SessionChanged session = 1;
}

// EntryLabelSet contains the committed active-session tree.
message EntryLabelSet {
  // The committed tree after the label mutation.
  SessionTree tree = 1;
}

// SessionTreeResult contains the complete active-session tree.
message SessionTreeResult {
  // The committed active-session tree.
  SessionTree tree = 1;
}

// SessionTreeNavigationResult reports one committed or canceled navigation.
message SessionTreeNavigationResult {
  // The navigation terminal status.
  optional SessionTreeNavigationStatus status = 1;
  // The committed tree. It is absent for canceled navigation.
  SessionTree tree = 2;
  // The committed active-branch transcript.
  repeated SessionEntry active_branch = 3;
  // The exact editable user input when the selected target is a user message.
  optional string next_input = 4;
  // Safe ordered operation issues.
  repeated OperationIssue issues = 5;
}

// SessionTreeFailed reports a navigation command that did not commit.
message SessionTreeFailed {
  // The stable failure code.
  optional SessionTreeFailureCode code = 1;
  // The safe failure message.
  optional string message = 2;
}

// SessionTree contains every persisted conversation entry and the optional active leaf.
message SessionTree {
  // Entries in persistence order.
  repeated SessionTreeEntry entries = 1;
  // The active leaf when the tree is not at its implicit root.
  optional string active_leaf_id = 2;
}

// SessionTreeEntry contains one entry, its parent relation, and label state.
message SessionTreeEntry {
  // The persisted entry identifier.
  optional string id = 1;
  // The parent entry identifier. Absence identifies a root entry.
  optional string parent_id = 2;
  // The persisted entry timestamp.
  google.protobuf.Timestamp created_time = 3;
  // The current label. An empty value means no label.
  optional string label = 4;
  // The entry payload.
  oneof entry {
    UserMessage user = 5;
    ModelResponse model = 6;
    ToolResult tool_result = 7;
    ExtensionEntry extension = 8;
    BranchSummary branch_summary = 9;
  }
}

// ExtensionEntry identifies one opaque extension entry without private payload bytes.
message ExtensionEntry {
  // The configured extension identifier.
  optional string extension_id = 1;
  // The extension-defined entry type.
  optional string entry_type = 2;
}

// BranchSummary contains one persisted abandoned-branch summary.
message BranchSummary {
  // The summary text.
  optional string summary = 1;
  // The first summarized abandoned-path entry identifier.
  optional string first_entry_id = 2;
  // The last summarized abandoned-path entry identifier.
  optional string last_entry_id = 3;
  // The configured provider identifier.
  optional string provider_id = 4;
  // The configured model identifier.
  optional string model_id = 5;
  // The reasoning choice used for the summary.
  optional ReasoningChoice reasoning_choice = 6;
  // Normalized usage when reported by the provider.
  TokenUsage usage = 7;
  // Persisted estimated cost when available.
  EstimatedCost estimated_cost = 8;
}

// OperationIssue reports one safe nonterminal handler or observer issue.
message OperationIssue {
  // The stable issue code.
  optional OperationIssueCode code = 1;
  // The configured extension identifier when applicable.
  optional string extension_id = 2;
  // The registered handler identifier when applicable.
  optional string handler_id = 3;
  // The safe issue message.
  optional string message = 4;
}

// SessionEntry contains one restored public terminal payload.
message SessionEntry {
  // The persisted entry identifier.
  optional string id = 1;
  // The persisted entry timestamp.
  google.protobuf.Timestamp created_time = 2;
  // The entry payload.
  oneof entry {
    UserMessage user = 3;
    ModelResponse model = 4;
    ToolResult tool_result = 5;
  }
}

// ToolResult carries one restored terminal tool result.
message ToolResult {
  // The provider-assigned tool call identifier.
  optional string call_id = 1;
  // The executed tool name.
  optional string tool_name = 2;
  // The ordered result content blocks.
  repeated ToolResultContent contents = 3;
  // Whether tool execution failed.
  optional bool is_error = 4;
}

// UserMessage carries ordered provider-neutral user content.
message UserMessage {
  // The ordered user content.
  repeated UserContent content = 1;
}

// UserContent carries one ordered user content item.
message UserContent {
  // The content payload.
  oneof content {
    string text = 1;
    UserImage image = 2;
  }
}

// UserImage carries exact binary image data and its media type.
message UserImage {
  // The image media type.
  optional string media_type = 1;
  // The exact binary image data.
  optional bytes data = 2;
}

// SessionInformation carries active-session information.
message SessionInformation {
  // The active-session information.
  SessionInfo info = 1;
  // The active-session counts and token totals.
  SessionStatistics statistics = 2;
}

// SessionStatistics contains counts and complete normalized token totals.
message SessionStatistics {
  // The number of stored user entries.
  optional int64 user_messages = 1;
  // The number of stored terminal model entries, including failures.
  optional int64 model_responses = 2;
  // The number of finalized tool calls inside model entries.
  optional int64 tool_calls = 3;
  // The number of stored tool-result entries.
  optional int64 tool_results = 4;
  // User messages plus model responses plus tool results.
  optional int64 total_messages = 5;
  // Tokens is absent when any stored model response has no usage.
  TokenUsage tokens = 6;
  // Estimated cost is absent when any stored model response has no persisted cost.
  EstimatedCost estimated_cost = 7;
  // Cost breakdown is ordered by provider identifier and then model identifier.
  repeated ProviderModelCost cost_breakdown = 8;
}

// EstimatedCost contains calculated USD cost for disjoint token buckets.
message EstimatedCost {
  // Uncached input cost.
  optional double input = 1;
  // Output cost, including reasoning cost.
  optional double output = 2;
  // Cache-read cost.
  optional double cache_read = 3;
  // Cache-write cost.
  optional double cache_write = 4;
  // The sum of all four cost buckets.
  optional double total = 5;
}

// ProviderModelCost groups persisted cost by configured provider and requested model.
message ProviderModelCost {
  // The configured provider identifier.
  optional string provider_id = 1;
  // The requested model identifier.
  optional string model_id = 2;
  // Estimated cost is absent when any response in this group has no persisted cost.
  EstimatedCost estimated_cost = 3;
}

// TokenUsage contains disjoint normalized token buckets.
message TokenUsage {
  // Uncached input tokens.
  optional int64 input_tokens = 1;
  // Output tokens, including reasoning tokens.
  optional int64 output_tokens = 2;
  // Cached input tokens.
  optional int64 cache_read_tokens = 3;
  // Cache creation input tokens.
  optional int64 cache_write_tokens = 4;
  // Reasoning tokens are a subset of output tokens.
  optional int64 reasoning_tokens = 5;
  // The sum of input, output, cache-read, and cache-write tokens.
  optional int64 total_tokens = 6;
}

// ReasoningChoice identifies a configured model reasoning choice.
enum ReasoningChoice {
  // No reasoning choice was provided.
  REASONING_CHOICE_UNSPECIFIED = 0;
  // Reasoning is disabled.
  REASONING_CHOICE_OFF = 1;
  // Reasoning is enabled with the provider default.
  REASONING_CHOICE_ON = 2;
  // Minimal reasoning is enabled.
  REASONING_CHOICE_MINIMAL = 3;
  // Low reasoning is enabled.
  REASONING_CHOICE_LOW = 4;
  // Medium reasoning is enabled.
  REASONING_CHOICE_MEDIUM = 5;
  // High reasoning is enabled.
  REASONING_CHOICE_HIGH = 6;
  // Extra-high reasoning is enabled.
  REASONING_CHOICE_XHIGH = 7;
  // Maximum reasoning is enabled.
  REASONING_CHOICE_MAX = 8;
}

// StartupContent carries one informational, warning, or error startup item.
message StartupContent {
  // The severity used to present this startup item.
  optional ContentSeverity severity = 1;
  // The user-visible startup item text.
  optional string text = 2;
}

// ContentSeverity identifies startup content importance.
enum ContentSeverity {
  // No content severity was provided.
  CONTENT_SEVERITY_UNSPECIFIED = 0;
  // The content is informational.
  CONTENT_SEVERITY_INFORMATION = 1;
  // The content reports an error.
  CONTENT_SEVERITY_ERROR = 2;
  // The content reports a warning.
  CONTENT_SEVERITY_WARNING = 3;
}

// ExtensionAvailability describes one available extension, its executable path, and its tool names.
message ExtensionAvailability {
  // The configured extension plugin identifier.
  optional string plugin_id = 1;
  // The tool names exposed by the extension.
  repeated string tools = 2;
  // The resolved extension executable path.
  optional string path = 3;
}

// Availability identifies whether the Host can accept a user request.
enum Availability {
  // No Host availability was provided.
  AVAILABILITY_UNSPECIFIED = 0;
  // The Host is checking stored authentication.
  AVAILABILITY_CHECKING_AUTHENTICATION = 1;
  // The Host is waiting for authentication.
  AVAILABILITY_AUTHENTICATING = 2;
  // Authentication failed and can be retried.
  AVAILABILITY_AUTHENTICATION_FAILED = 3;
  // The Host can accept a user request.
  AVAILABILITY_IDLE = 4;
  // The Host is processing an agent run.
  AVAILABILITY_RUNNING = 5;
}

// LifecycleEvent carries one explicit provider-neutral lifecycle update.
message LifecycleEvent {
  // The lifecycle transition represented by this event.
  optional LifecycleType type = 1;
  // The identifier of the associated agent run.
  optional string run_id = 2;
  // The user-visible text carried by the transition.
  optional string text = 3;
  // The provider-assigned tool call identifier.
  optional string tool_call_id = 4;
  // The name of the associated tool.
  optional string tool_name = 5;
  // The semantic channel of a tool progress update.
  optional ProgressChannel progress_channel = 6;
  // Whether the associated operation failed.
  optional bool is_error = 7;
  // The provider-neutral terminal outcome.
  optional string outcome = 8;
  // The safe user-visible error message.
  optional string error_message = 9;
  // The Host availability after this transition.
  optional Availability availability = 10;
  // The typed incremental model content transition.
  ModelContent model_content = 11;
  // The finalized model response.
  ModelResponse model_response = 12;
  // The transient tool call state assembled from deltas.
  ToolCallPreview tool_call_preview = 13;
  // The finalized tool call and decoded arguments.
  FinalToolCall final_tool_call = 14;
  // The ordered typed terminal tool result blocks.
  repeated ToolResultContent tool_result_contents = 15;
}

// ToolResultContent carries one ordered terminal tool result block.
message ToolResultContent {
  // The result content payload.
  oneof content {
    // The UTF-8 text payload.
    string text = 1;
    // The binary image payload.
    ToolResultImage image = 2;
  }
}

// ToolResultImage carries binary image data and its media type.
message ToolResultImage {
  // The image media type.
  optional string media_type = 1;
  // The binary image data.
  optional bytes data = 2;
}

// ToolCallPreview carries transient provenance-aware function-call state.
message ToolCallPreview {
  // The provider-assigned tool call identifier.
  optional string call_id = 1;
  // The current tool name.
  optional string name = 2;
  // The zero-based position in the model response.
  optional int32 position = 3;
  // Whether the preview can still change.
  optional bool provisional = 4;
  // The currently decoded argument fields.
  repeated ToolCallPreviewField fields = 5;
}

// ToolCallPreviewField carries either one complete value or one exact scalar prefix.
message ToolCallPreviewField {
  // The argument field name.
  optional string name = 1;
  // The complete value or exact scalar prefix.
  oneof content {
    google.protobuf.Value value = 2;
    string prefix = 3;
  }
}

// FinalToolCall carries exact arguments decoded at function-call completion.
message FinalToolCall {
  // The provider-assigned tool call identifier.
  optional string call_id = 1;
  // The finalized tool name.
  optional string name = 2;
  // The zero-based position in the model response.
  optional int32 position = 3;
  // The decoded tool arguments.
  google.protobuf.Struct arguments = 4;
}

// ModelContent carries one typed model content transition.
message ModelContent {
  // The transition applied to this model content block.
  optional ModelContentType type = 1;
  // The zero-based content block position.
  optional int32 position = 2;
  // The text delta carried by this transition.
  optional string text = 3;
  // The semantic kind of the content block.
  optional ModelContentKind kind = 4;
}

// ModelContentKind identifies visible text, refusal, or hidden reasoning content.
enum ModelContentKind {
  // No content kind was provided.
  MODEL_CONTENT_KIND_UNSPECIFIED = 0;
  // The content is public response text.
  MODEL_CONTENT_KIND_TEXT = 1;
  // The content is hidden model reasoning.
  MODEL_CONTENT_KIND_REASONING = 2;
  // The content is a model refusal.
  MODEL_CONTENT_KIND_REFUSAL = 3;
}

// ModelContentType identifies one content transition.
enum ModelContentType {
  // No model content transition was provided.
  MODEL_CONTENT_TYPE_UNSPECIFIED = 0;
  // A model content block started.
  MODEL_CONTENT_TYPE_START = 1;
  // A text delta was appended to a content block.
  MODEL_CONTENT_TYPE_TEXT_DELTA = 2;
  // A model content block ended.
  MODEL_CONTENT_TYPE_END = 3;
}

// ModelResponse carries typed terminal data and public text.
message ModelResponse {
  // The finalized public response text.
  optional string text = 1;
  // The provider-neutral response outcome.
  optional string outcome = 2;
  // The safe user-visible terminal error.
  optional string error_message = 3;
  // The provider that produced the response.
  optional string provider = 4;
  // The configured model identifier.
  optional string model = 5;
  // The provider-assigned response identifier.
  optional string response_id = 6;
  // The provider-reported token usage.
  ModelUsage usage = 7;
  // The safe diagnostics produced while processing the response.
  repeated ModelDiagnostic diagnostics = 8;
  // The ordered finalized response content blocks.
  repeated ModelResponseContent content = 9;
  // The model identifier reported by the provider response.
  optional string response_model = 10;
}

// ModelResponseContent carries one ordered finalized text, refusal, or reasoning block.
message ModelResponseContent {
  // The semantic kind of this finalized content block.
  optional ModelContentKind kind = 1;
  // The finalized content block text.
  optional string text = 2;
  // The finalized tool call when this content position invokes a tool.
  FinalToolCall tool_call = 3;
}

// ModelUsage carries provider-reported token accounting.
message ModelUsage {
  // The number of input tokens processed.
  optional int64 input_tokens = 1;
  // The number of output tokens generated.
  optional int64 output_tokens = 2;
  // The number of input tokens read from a cache.
  optional int64 cached_input_tokens = 3;
  // The number of input tokens written to a cache.
  optional int64 cache_write_tokens = 4;
  // The number of output tokens used for reasoning.
  optional int64 reasoning_tokens = 5;
  // The total provider-reported token count.
  optional int64 total_tokens = 6;
}

// ModelDiagnostic carries safe typed provider diagnostics.
message ModelDiagnostic {
  // The stable machine-readable diagnostic code.
  optional string code = 1;
  // The safe diagnostic message.
  optional string message = 2;
}

// LifecycleType identifies the ordered Host or Agent lifecycle transition.
enum LifecycleType {
  // No lifecycle transition was provided.
  LIFECYCLE_TYPE_UNSPECIFIED = 0;
  // The agent run started.
  LIFECYCLE_TYPE_AGENT_START = 1;
  // An agent turn started.
  LIFECYCLE_TYPE_TURN_START = 2;
  // A model response message started.
  LIFECYCLE_TYPE_MESSAGE_START = 3;
  // A model response message ended.
  LIFECYCLE_TYPE_MESSAGE_END = 4;
  // Tool execution started.
  LIFECYCLE_TYPE_TOOL_EXECUTION_START = 5;
  // Tool execution emitted progress.
  LIFECYCLE_TYPE_TOOL_EXECUTION_UPDATE = 6;
  // Tool execution ended.
  LIFECYCLE_TYPE_TOOL_EXECUTION_END = 7;
  // A terminal tool result became available.
  LIFECYCLE_TYPE_TOOL_RESULT = 8;
  // The current agent turn ended.
  LIFECYCLE_TYPE_TURN_END = 9;
  // The agent run ended.
  LIFECYCLE_TYPE_AGENT_END = 10;
  // The agent completed all terminal processing.
  LIFECYCLE_TYPE_AGENT_SETTLED = 11;
  // Host availability changed.
  LIFECYCLE_TYPE_AVAILABILITY_CHANGED = 12;
  // A typed model content block started.
  LIFECYCLE_TYPE_MODEL_CONTENT_START = 13;
  // A typed model text delta arrived.
  LIFECYCLE_TYPE_MODEL_TEXT_DELTA = 14;
  // A typed model content block ended.
  LIFECYCLE_TYPE_MODEL_CONTENT_END = 15;
  // Incremental tool call generation started.
  LIFECYCLE_TYPE_TOOL_CALL_START = 16;
  // Incremental tool call state changed.
  LIFECYCLE_TYPE_TOOL_CALL_DELTA = 17;
  // Tool call generation ended.
  LIFECYCLE_TYPE_TOOL_CALL_END = 18;
}

// ProgressChannel identifies the meaning of one tool progress fragment.
enum ProgressChannel {
  // No progress channel was provided.
  PROGRESS_CHANNEL_UNSPECIFIED = 0;
  // The fragment reports status information.
  PROGRESS_CHANNEL_STATUS = 1;
  // The fragment contains standard output.
  PROGRESS_CHANNEL_STDOUT = 2;
  // The fragment contains standard error.
  PROGRESS_CHANNEL_STDERR = 3;
}

// AuthorizationRequest presents one browser OAuth URL.
message AuthorizationRequest {
  // The browser URL used to start authorization.
  optional string url = 1;
}

// Information carries one user-visible Host notification.
message Information {
  // The user-visible informational text.
  optional string text = 1;
}

// Error carries one safe user-visible failure.
message Error {
  // The safe user-visible error text.
  optional string text = 1;
  // Whether the UI should offer authentication retry.
  optional bool retry_authentication = 2;
}

// OpenResponse carries exactly one UI-to-Host command.
message OpenResponse {
  // The UI command payload.
  oneof content {
    SubmitCommand submit = 1;
    StopCommand stop = 2;
    RetryAuthenticationCommand retry_authentication = 3;
    QuitCommand quit = 4;
    SelectModelCommand select_model = 5;
    SelectReasoningChoiceCommand select_reasoning_choice = 6;
    CreateSessionCommand create_session = 7;
    ListSessionsCommand list_sessions = 8;
    ResumeSessionCommand resume_session = 9;
    SetSessionNameCommand set_session_name = 10;
    GetSessionInfoCommand get_session_info = 11;
    GetSessionTreeCommand get_session_tree = 12;
    NavigateSessionTreeCommand navigate_session_tree = 13;
    ForkSessionCommand fork_session = 14;
    CloneSessionCommand clone_session = 15;
    SetEntryLabelCommand set_entry_label = 16;
  }
}

// SubmitCommand requests one user turn.
message SubmitCommand {
  // The user request submitted to the Host.
  optional string text = 1;
}

// StopCommand cancels the active agent run.
message StopCommand {}

// RetryAuthenticationCommand starts OAuth after an authentication failure.
message RetryAuthenticationCommand {}

// QuitCommand terminates the UI session.
message QuitCommand {}

// SelectModelCommand requests one configured provider and model.
message SelectModelCommand {
  // The configured provider instance identifier.
  optional string provider_id = 1;
  // The configured model identifier.
  optional string model_id = 2;
}

// SelectReasoningChoiceCommand requests one reasoning choice for the active model.
message SelectReasoningChoiceCommand {
  // The requested reasoning choice.
  optional ReasoningChoice choice = 1;
}

// CreateSessionCommand requests a new empty active session.
message CreateSessionCommand {}

// ListSessionsCommand requests stored sessions for the active project.
message ListSessionsCommand {}

// ResumeSessionCommand requests active-session replacement by opaque identifier.
message ResumeSessionCommand {
  // The opaque stored session identifier.
  optional string session_id = 1;
}

// SetSessionNameCommand requests a persisted active-session name.
message SetSessionNameCommand {
  // The requested session name before Host normalization.
  optional string name = 1;
}

// GetSessionInfoCommand requests active-session information.
message GetSessionInfoCommand {}

// GetSessionTreeCommand requests the complete active-session tree.
message GetSessionTreeCommand {}

// NavigateSessionTreeCommand requests one session-tree navigation.
message NavigateSessionTreeCommand {
  // The selected tree entry identifier.
  optional string target_entry_id = 1;
  // The requested branch-summary behavior.
  optional SummaryMode summary_mode = 2;
  // The custom summary focus. It is valid only for custom-prompt mode.
  optional string custom_focus = 3;
}

// ForkSessionCommand creates a replacement session before one selected user message.
message ForkSessionCommand {
  // The selected user-message entry identifier.
  optional string target_entry_id = 1;
}

// CloneSessionCommand creates a replacement session from the complete active branch.
message CloneSessionCommand {}

// SetEntryLabelCommand changes or clears one persisted entry label.
message SetEntryLabelCommand {
  // The target tree entry identifier.
  optional string target_entry_id = 1;
  // The new label. An empty value clears the label.
  optional string label = 2;
}

// SummaryMode identifies branch-summary behavior for tree navigation.
enum SummaryMode {
  // No summary mode was provided.
  SUMMARY_MODE_UNSPECIFIED = 0;
  // Navigation creates no branch summary.
  SUMMARY_MODE_NO_SUMMARY = 1;
  // Navigation uses the built-in branch summarizer.
  SUMMARY_MODE_SUMMARIZE = 2;
  // Navigation uses the built-in summarizer with a custom focus.
  SUMMARY_MODE_SUMMARIZE_WITH_CUSTOM_PROMPT = 3;
}

// SessionTreeNavigationStatus identifies a tree-navigation terminal result.
enum SessionTreeNavigationStatus {
  // No terminal status was provided.
  SESSION_TREE_NAVIGATION_STATUS_UNSPECIFIED = 0;
  // Navigation committed.
  SESSION_TREE_NAVIGATION_STATUS_COMMITTED = 1;
  // Navigation was canceled before commit.
  SESSION_TREE_NAVIGATION_STATUS_CANCELED = 2;
}

// SessionTreeFailureCode identifies why tree navigation failed.
enum SessionTreeFailureCode {
  // No failure code was provided.
  SESSION_TREE_FAILURE_CODE_UNSPECIFIED = 0;
  // Command arguments are invalid.
  SESSION_TREE_FAILURE_CODE_INVALID_ARGUMENT = 1;
  // The target entry does not exist.
  SESSION_TREE_FAILURE_CODE_NOT_FOUND = 2;
  // Another operation owns the session gate.
  SESSION_TREE_FAILURE_CODE_BUSY = 3;
  // The selected summary model is unavailable.
  SESSION_TREE_FAILURE_CODE_MODEL_UNAVAILABLE = 4;
  // Summary-model credentials are unavailable.
  SESSION_TREE_FAILURE_CODE_CREDENTIAL_UNAVAILABLE = 5;
  // Summary-model execution failed.
  SESSION_TREE_FAILURE_CODE_MODEL_FAILED = 6;
  // An extension returned an invalid result.
  SESSION_TREE_FAILURE_CODE_EXTENSION_INVALID_RESULT = 7;
  // An extension is unavailable.
  SESSION_TREE_FAILURE_CODE_EXTENSION_UNAVAILABLE = 8;
  // The active session cannot accept persistence mutations.
  SESSION_TREE_FAILURE_CODE_PERSISTENCE_UNAVAILABLE = 9;
  // An unclassified Host failure occurred.
  SESSION_TREE_FAILURE_CODE_INTERNAL = 10;
}

// OperationIssueCode identifies one safe nonterminal issue.
enum OperationIssueCode {
  // No issue code was provided.
  OPERATION_ISSUE_CODE_UNSPECIFIED = 0;
  // An extension handler returned an ordinary error.
  OPERATION_ISSUE_CODE_HANDLER_ERROR = 1;
  // An extension handler returned an invalid action.
  OPERATION_ISSUE_CODE_INVALID_HANDLER_ACTION = 2;
  // A post-commit observer returned an error.
  OPERATION_ISSUE_CODE_OBSERVER_ERROR = 3;
}
