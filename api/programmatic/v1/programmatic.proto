edition = "2023";

package glyph.programmatic.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/n-r-w/glyph/pkg/programmatic/v1;programmaticv1";

// ProgrammaticControlService exposes one programmatic control session.
service ProgrammaticControlService {
  // Open exchanges commands, command responses, and agent events.
  rpc Open(stream OpenRequest) returns (stream OpenResponse);
}

// OpenRequest carries one correlated command.
message OpenRequest {
  // The controller-assigned command correlation identifier.
  string correlation_id = 1;
  // The command payload.
  oneof command {
    UserRequest user_request = 2;
    Abort abort = 3;
    GetRunState get_run_state = 4;
    GetMessages get_messages = 5;
    GetModels get_models = 6;
    SelectModel select_model = 7;
    SelectReasoningChoice select_reasoning_choice = 8;
    CreateSession create_session = 9;
    ListSessions list_sessions = 10;
    ResumeSession resume_session = 11;
    SetSessionName set_session_name = 12;
    GetSessionInfo get_session_info = 13;
    GetSessionEntries get_session_entries = 14;
    GetSessionStats get_session_stats = 15;
  }
}

// UserRequest starts an agent run for user text.
message UserRequest {
  // The user request text.
  string text = 1;
}

// Abort cancels the active agent run.
message Abort {}

// GetRunState requests the current run state.
message GetRunState {}

// GetMessages requests the current public message history.
message GetMessages {}

// GetModels requests the configured model catalogue and active selection.
message GetModels {}

// SelectModel selects one configured provider and model.
message SelectModel {
  // The configured provider identifier.
  string provider_id = 1;
  // The configured model identifier.
  string model_id = 2;
}

// SelectReasoningChoice selects the active model reasoning choice.
message SelectReasoningChoice {
  // The requested reasoning choice.
  ReasoningChoice choice = 1;
}

// CreateSession requests a new empty active session.
message CreateSession {}

// ListSessions requests stored sessions for the active project.
message ListSessions {}

// ResumeSession requests active-session replacement by opaque identifier.
message ResumeSession {
  // The opaque stored session identifier.
  string session_id = 1;
}

// SetSessionName requests a persisted active-session name.
message SetSessionName {
  // The requested session name before Host normalization.
  string name = 1;
}

// GetSessionInfo requests active-session information.
message GetSessionInfo {}

// GetSessionEntries requests detailed active-session text entries.
message GetSessionEntries {}

// GetSessionStats requests active-session counts and token totals.
message GetSessionStats {}

// OpenResponse carries one correlated command response or agent event.
message OpenResponse {
  // The correlation identifier associated with the response.
  string correlation_id = 1;
  // The response payload.
  oneof content {
    CommandResponse command_response = 2;
    AgentEvent agent_event = 3;
  }
}

// CommandResponse carries exactly one command result.
message CommandResponse {
  // The command result.
  oneof result {
    UserRequestAccepted user_request_accepted = 1;
    AbortCompleted abort_completed = 2;
    RunStateResult run_state = 3;
    MessagesResult messages = 4;
    CommandRejected rejected = 5;
    ModelsResult models = 6;
    ModelSelectionResult model_selection = 7;
    SessionInfoResult session_info = 8;
    SessionsResult sessions = 9;
    SessionEntriesResult session_entries = 10;
    SessionStatsResult session_stats = 11;
  }
}

// UserRequestAccepted confirms that an agent run was accepted.
message UserRequestAccepted {}

// AbortCompleted confirms that the active run settled after cancellation.
message AbortCompleted {}

// RunStateResult reports the current agent run state.
message RunStateResult {
  // The current run state.
  RunState state = 1;
  // The correlation identifier of the active user request.
  string active_correlation_id = 2;
}

// MessagesResult contains the ordered public message history.
message MessagesResult {
  // The ordered public history entries.
  repeated HistoryEntry entries = 1;
}

// ModelsResult contains the configured model catalogue and active selection.
message ModelsResult {
  // The configured models in catalogue order.
  repeated ConfiguredModel models = 1;
  // The active model selection.
  ModelSelection active_selection = 2;
}

// ConfiguredModel describes one configured provider model.
message ConfiguredModel {
  // The configured provider identifier.
  string provider_id = 1;
  // The configured model identifier.
  string model_id = 2;
  // The model reasoning capabilities.
  ReasoningCapabilities reasoning = 3;
}

// ReasoningCapabilities describes one model reasoning contract.
message ReasoningCapabilities {
  // Whether the model can produce reasoning.
  bool supported = 1;
  // The effective choices in configured order.
  repeated ReasoningChoice choices = 2;
  // The model default choice.
  ReasoningChoice default_choice = 3;
}

// ModelSelection identifies the active provider, model, and reasoning choice.
message ModelSelection {
  // The configured provider identifier.
  string provider_id = 1;
  // The configured model identifier.
  string model_id = 2;
  // The active reasoning choice.
  ReasoningChoice reasoning_choice = 3;
}

// ModelSelectionResult contains the committed model selection.
message ModelSelectionResult {
  // The committed model selection.
  ModelSelection selection = 1;
}

// SessionInfoResult contains active-session information.
message SessionInfoResult {
  // The active session information.
  SessionInfo info = 1;
}

// SessionsResult contains stored sessions in display order.
message SessionsResult {
  // The stored sessions in Host list order.
  repeated SessionSummary sessions = 1;
}

// SessionInfo contains lifecycle information for one session.
message SessionInfo {
  // The opaque session identifier.
  string id = 1;
  // The user-assigned name when present.
  string name = 2;
  // The canonical project working directory.
  string working_directory = 3;
  // The persisted JSONL path when present.
  string storage_path = 4;
  // The session creation time.
  google.protobuf.Timestamp created_time = 5;
  // The most recent stored update time.
  google.protobuf.Timestamp update_time = 6;
}

// SessionSummary contains one stored session list row.
message SessionSummary {
  // The session lifecycle information.
  SessionInfo info = 1;
  // The first public user text when present.
  string first_user_text = 2;
  // The number of stored public messages.
  int64 total_messages = 3;
}

// SessionStatsResult contains active-session counts and token totals.
message SessionStatsResult {
  // The active-session statistics.
  SessionStatistics statistics = 1;
}

// SessionStatistics contains counts and complete normalized token totals.
message SessionStatistics {
  // The number of stored user entries.
  int64 user_messages = 1;
  // The number of stored terminal model entries, including failures.
  int64 model_responses = 2;
  // The number of finalized tool calls inside model entries.
  int64 tool_calls = 3;
  // The number of stored tool-result entries.
  int64 tool_results = 4;
  // User messages plus model responses plus tool results.
  int64 total_messages = 5;
  // Tokens is absent when any stored model response has no usage.
  TokenUsage tokens = 6;
  // Estimated cost is absent when any stored model response has no persisted cost.
  EstimatedCost estimated_cost = 7;
  // Cost breakdown is ordered by provider identifier and then model identifier.
  repeated ProviderModelCost cost_breakdown = 8;
}

// EstimatedCost contains calculated USD cost for disjoint token buckets.
message EstimatedCost {
  // Uncached input cost.
  double input = 1;
  // Output cost, including reasoning cost.
  double output = 2;
  // Cache-read cost.
  double cache_read = 3;
  // Cache-write cost.
  double cache_write = 4;
  // The sum of all four cost buckets.
  double total = 5;
}

// ProviderModelCost groups persisted cost by configured provider and requested model.
message ProviderModelCost {
  // The configured provider identifier.
  string provider_id = 1;
  // The requested model identifier.
  string model_id = 2;
  // Estimated cost is absent when any response in this group has no persisted cost.
  EstimatedCost estimated_cost = 3;
}

// TokenUsage contains disjoint normalized token buckets.
message TokenUsage {
  // Uncached input tokens.
  int64 input_tokens = 1;
  // Output tokens, including reasoning tokens.
  int64 output_tokens = 2;
  // Cached input tokens.
  int64 cache_read_tokens = 3;
  // Cache creation input tokens.
  int64 cache_write_tokens = 4;
  // Reasoning tokens are a subset of output tokens.
  int64 reasoning_tokens = 5;
  // The sum of input, output, cache-read, and cache-write tokens.
  int64 total_tokens = 6;
}

// CommandRejected describes a command that was not executed.
message CommandRejected {
  // The rejected command type.
  CommandType command = 1;
  // The stable rejection code.
  RejectionCode code = 2;
  // The safe rejection message.
  string message = 3;
}

// SessionEntriesResult contains ordered detailed active-session entries.
message SessionEntriesResult {
  // The ordered active-session entries.
  repeated SessionEntry entries = 1;
}

// SessionEntry contains stable metadata and one public terminal payload.
message SessionEntry {
  // The persisted entry identifier.
  string id = 1;
  // The persisted entry timestamp.
  google.protobuf.Timestamp created_time = 2;
  // The entry payload.
  oneof entry {
    UserMessage user = 3;
    ModelResponse model = 4;
    ToolResult tool_result = 5;
  }
  // Estimated cost is present only for a model entry with calculated cost.
  EstimatedCost estimated_cost = 6;
}

// HistoryEntry carries one public message history item.
message HistoryEntry {
  // The history item payload.
  oneof entry {
    UserMessage user = 1;
    ModelResponse model = 2;
    ToolResult tool_result = 3;
  }
}

// UserMessage carries one user history item.
message UserMessage {
  reserved 1;
  reserved text;
  // The ordered provider-neutral user content.
  repeated UserContent content = 2;
}

// UserContent carries one ordered user content item.
message UserContent {
  // The content payload.
  oneof content {
    string text = 1;
    UserImage image = 2;
  }
}

// UserImage carries exact binary image data and its media type.
message UserImage {
  // The image media type.
  string media_type = 1;
  // The exact binary image data.
  bytes data = 2;
}

// AgentEvent carries one correlated agent lifecycle event.
message AgentEvent {
  // The event type.
  AgentEventType type = 1;
  // The Host run identifier.
  string run_id = 2;
  // The event payload.
  oneof payload {
    ModelContent model_content = 3;
    ToolCallPreview tool_call_preview = 4;
    FinalToolCall final_tool_call = 5;
    ToolExecution tool_execution = 6;
    ToolProgress tool_progress = 7;
    ToolResult tool_result = 8;
    ModelResponse model_response = 9;
    TurnSummary turn = 10;
    AgentSummary agent = 11;
  }
}

// ModelContent carries one typed model content transition.
message ModelContent {
  // The semantic content kind.
  ModelContentKind kind = 1;
  // The zero-based position in the model response.
  int32 position = 2;
  // The text carried by the transition.
  string text = 3;
}

// ToolCallPreview carries transient function-call state.
message ToolCallPreview {
  // The provider-assigned tool call identifier.
  string call_id = 1;
  // The current tool name.
  string name = 2;
  // The zero-based position in the model response.
  int32 position = 3;
  // Whether the preview can still change.
  bool provisional = 4;
  // The currently decoded argument fields.
  repeated ToolCallPreviewField fields = 5;
}

// ToolCallPreviewField carries one decoded value or scalar prefix.
message ToolCallPreviewField {
  // The argument field name.
  string name = 1;
  // The decoded field content.
  oneof content {
    google.protobuf.Value value = 2;
    string prefix = 3;
  }
}

// FinalToolCall carries a completed function call.
message FinalToolCall {
  // The provider-assigned tool call identifier.
  string call_id = 1;
  // The finalized tool name.
  string name = 2;
  // The zero-based position in the model response.
  int32 position = 3;
  // The decoded tool arguments.
  google.protobuf.Struct arguments = 4;
}

// ToolExecution identifies a tool execution transition.
message ToolExecution {
  // The provider-assigned tool call identifier.
  string call_id = 1;
  // The executed tool name.
  string tool_name = 2;
}

// ToolProgress carries one tool progress fragment.
message ToolProgress {
  // The semantic progress channel.
  ProgressChannel channel = 1;
  // The progress fragment content.
  string content = 2;
}

// ToolResult carries the terminal result of one tool call.
message ToolResult {
  // The provider-assigned tool call identifier.
  string call_id = 1;
  // The executed tool name.
  string tool_name = 2;
  // The ordered result content blocks.
  repeated ToolResultContent contents = 3;
  // Whether tool execution failed.
  bool is_error = 4;
}

// ToolResultContent carries one ordered tool result block.
message ToolResultContent {
  // The result block content.
  oneof content {
    string text = 1;
    ToolResultImage image = 2;
  }
}

// ToolResultImage carries binary image data and its media type.
message ToolResultImage {
  // The image media type.
  string media_type = 1;
  // The exact binary image data.
  bytes data = 2;
}

// ModelResponse carries a finalized model response.
message ModelResponse {
  // The concatenated finalized public text.
  string text = 1;
  // The provider-neutral response outcome.
  ModelOutcome outcome = 2;
  // The safe terminal error message.
  string error_message = 3;
  // The provider that produced the response.
  string provider = 4;
  // The configured model identifier.
  string model = 5;
  // The model identifier reported by the provider response.
  string response_model = 6;
  // The provider-assigned response identifier.
  string response_id = 7;
  // The provider-reported token usage.
  ModelUsage usage = 8;
  // The safe response diagnostics.
  repeated ModelDiagnostic diagnostics = 9;
  // The ordered finalized response content.
  repeated ModelResponseItem content = 10;
}

// ModelResponseItem carries one finalized model response item.
message ModelResponseItem {
  // The finalized response item content.
  oneof content {
    FinalText text = 1;
    FinalText refusal = 2;
    FinalText reasoning = 3;
    FinalToolCall tool_call = 4;
  }
}

// FinalText carries one finalized text block.
message FinalText {
  // The finalized block text.
  string text = 1;
}

// ModelUsage carries provider-reported token accounting.
message ModelUsage {
  // The number of input tokens processed.
  int64 input_tokens = 1;
  // The number of output tokens generated.
  int64 output_tokens = 2;
  // The number of input tokens read from a cache.
  int64 cached_input_tokens = 3;
  // The number of input tokens written to a cache.
  int64 cache_write_tokens = 4;
  // The number of output tokens used for reasoning.
  int64 reasoning_tokens = 5;
  // The total provider-reported token count.
  int64 total_tokens = 6;
}

// ModelDiagnostic carries one safe provider diagnostic.
message ModelDiagnostic {
  // The stable machine-readable diagnostic code.
  string code = 1;
  // The safe diagnostic message.
  string message = 2;
}

// TurnSummary carries the finalized response and tool results for one turn.
message TurnSummary {
  // The finalized model response.
  ModelResponse response = 1;
  // The ordered terminal tool results.
  repeated ToolResult tool_results = 2;
}

// AgentSummary carries the terminal outcome of one agent run.
message AgentSummary {
  // The run outcome.
  RunOutcome outcome = 1;
  // The safe terminal error message.
  string error_message = 2;
}

// CommandType identifies a controller command.
enum CommandType {
  // No command type was provided.
  COMMAND_TYPE_UNSPECIFIED = 0;
  // A user request command.
  COMMAND_TYPE_USER_REQUEST = 1;
  // An abort command.
  COMMAND_TYPE_ABORT = 2;
  // A run-state query.
  COMMAND_TYPE_GET_RUN_STATE = 3;
  // A message-history query.
  COMMAND_TYPE_GET_MESSAGES = 4;
  // A configured-model query.
  COMMAND_TYPE_GET_MODELS = 5;
  // A model selection command.
  COMMAND_TYPE_SELECT_MODEL = 6;
  // A reasoning-choice selection command.
  COMMAND_TYPE_SELECT_REASONING_CHOICE = 7;
  // A new-session command.
  COMMAND_TYPE_CREATE_SESSION = 8;
  // A stored-session query.
  COMMAND_TYPE_LIST_SESSIONS = 9;
  // A session-resume command.
  COMMAND_TYPE_RESUME_SESSION = 10;
  // A session-name command.
  COMMAND_TYPE_SET_SESSION_NAME = 11;
  // An active-session information query.
  COMMAND_TYPE_GET_SESSION_INFO = 12;
  // An active-session entry query.
  COMMAND_TYPE_GET_SESSION_ENTRIES = 13;
  // An active-session statistics query.
  COMMAND_TYPE_GET_SESSION_STATS = 14;
}

// RejectionCode identifies why a command was rejected.
enum RejectionCode {
  // No rejection code was provided.
  REJECTION_CODE_UNSPECIFIED = 0;
  // The command arguments are invalid.
  REJECTION_CODE_INVALID_ARGUMENT = 1;
  // Another agent run is active.
  REJECTION_CODE_BUSY = 2;
  // No agent run is active.
  REJECTION_CODE_NO_ACTIVE_RUN = 3;
  // The correlation identifier belongs to the active run.
  REJECTION_CODE_CORRELATION_IN_USE = 4;
  // An internal operation failed.
  REJECTION_CODE_INTERNAL = 5;
  // The provider-model pair was not found.
  REJECTION_CODE_NOT_FOUND = 6;
  // The reasoning choice is not supported.
  REJECTION_CODE_REASONING_UNSUPPORTED = 7;
  // The selected model credential is unavailable.
  REJECTION_CODE_CREDENTIAL_UNAVAILABLE = 8;
  // The requested session file cannot be resumed.
  REJECTION_CODE_SESSION_UNAVAILABLE = 9;
}

// ReasoningChoice identifies provider-neutral reasoning behavior.
enum ReasoningChoice {
  // No reasoning choice was provided.
  REASONING_CHOICE_UNSPECIFIED = 0;
  // Reasoning effort is disabled.
  REASONING_CHOICE_OFF = 1;
  // Reasoning is enabled with the provider default.
  REASONING_CHOICE_ON = 2;
  // Minimal reasoning effort.
  REASONING_CHOICE_MINIMAL = 3;
  // Low reasoning effort.
  REASONING_CHOICE_LOW = 4;
  // Medium reasoning effort.
  REASONING_CHOICE_MEDIUM = 5;
  // High reasoning effort.
  REASONING_CHOICE_HIGH = 6;
  // Extra-high reasoning effort.
  REASONING_CHOICE_XHIGH = 7;
  // Maximum reasoning effort.
  REASONING_CHOICE_MAX = 8;
}

// RunState identifies whether an agent run is active.
enum RunState {
  // No run state was provided.
  RUN_STATE_UNSPECIFIED = 0;
  // No agent run is active.
  RUN_STATE_IDLE = 1;
  // An agent run is active.
  RUN_STATE_RUNNING = 2;
}

// AgentEventType identifies an agent lifecycle event.
enum AgentEventType {
  // No agent event type was provided.
  AGENT_EVENT_TYPE_UNSPECIFIED = 0;
  // The agent run started.
  AGENT_EVENT_TYPE_AGENT_START = 1;
  // An agent turn started.
  AGENT_EVENT_TYPE_TURN_START = 2;
  // A model response message started.
  AGENT_EVENT_TYPE_MESSAGE_START = 3;
  // A model content block started.
  AGENT_EVENT_TYPE_MODEL_CONTENT_START = 4;
  // A model text delta arrived.
  AGENT_EVENT_TYPE_MODEL_TEXT_DELTA = 5;
  // A model content block ended.
  AGENT_EVENT_TYPE_MODEL_CONTENT_END = 6;
  // Incremental tool call generation started.
  AGENT_EVENT_TYPE_TOOL_CALL_START = 7;
  // Incremental tool call state changed.
  AGENT_EVENT_TYPE_TOOL_CALL_DELTA = 8;
  // Tool call generation ended.
  AGENT_EVENT_TYPE_TOOL_CALL_END = 9;
  // A model response message ended.
  AGENT_EVENT_TYPE_MESSAGE_END = 10;
  // Tool execution started.
  AGENT_EVENT_TYPE_TOOL_EXECUTION_START = 11;
  // Tool execution emitted progress.
  AGENT_EVENT_TYPE_TOOL_EXECUTION_UPDATE = 12;
  // Tool execution ended.
  AGENT_EVENT_TYPE_TOOL_EXECUTION_END = 13;
  // A terminal tool result became available.
  AGENT_EVENT_TYPE_TOOL_RESULT = 14;
  // The current agent turn ended.
  AGENT_EVENT_TYPE_TURN_END = 15;
  // The agent run ended.
  AGENT_EVENT_TYPE_AGENT_END = 16;
  // The agent completed all terminal processing.
  AGENT_EVENT_TYPE_AGENT_SETTLED = 17;
}

// ModelContentKind identifies model content semantics.
enum ModelContentKind {
  // No content kind was provided.
  MODEL_CONTENT_KIND_UNSPECIFIED = 0;
  // The content is public response text.
  MODEL_CONTENT_KIND_TEXT = 1;
  // The content is hidden model reasoning.
  MODEL_CONTENT_KIND_REASONING = 2;
  // The content is a model refusal.
  MODEL_CONTENT_KIND_REFUSAL = 3;
}

// ProgressChannel identifies the meaning of a tool progress fragment.
enum ProgressChannel {
  // No progress channel was provided.
  PROGRESS_CHANNEL_UNSPECIFIED = 0;
  // The fragment reports status information.
  PROGRESS_CHANNEL_STATUS = 1;
  // The fragment contains standard output.
  PROGRESS_CHANNEL_STDOUT = 2;
  // The fragment contains standard error.
  PROGRESS_CHANNEL_STDERR = 3;
}

// ModelOutcome identifies a terminal model response outcome.
enum ModelOutcome {
  // No model outcome was provided.
  MODEL_OUTCOME_UNSPECIFIED = 0;
  // The model completed normally.
  MODEL_OUTCOME_STOP = 1;
  // The model requested tool execution.
  MODEL_OUTCOME_TOOL_USE = 2;
  // The model reached an output limit.
  MODEL_OUTCOME_LENGTH = 3;
  // The model response was aborted.
  MODEL_OUTCOME_ABORTED = 4;
  // The model response failed.
  MODEL_OUTCOME_FAILED = 5;
}

// RunOutcome identifies a terminal agent run outcome.
enum RunOutcome {
  // No run outcome was provided.
  RUN_OUTCOME_UNSPECIFIED = 0;
  // The agent run completed normally.
  RUN_OUTCOME_COMPLETED = 1;
  // The agent run was aborted.
  RUN_OUTCOME_ABORTED = 2;
  // The agent run failed.
  RUN_OUTCOME_FAILED = 3;
}
