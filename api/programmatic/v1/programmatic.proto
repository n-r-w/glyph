edition = "2023";

package glyph.programmatic.v1;

import "api/operation/v1/operation.proto";
import "api/programmatic/v1/agent.proto";
import "api/programmatic/v1/model.proto";
import "api/programmatic/v1/session.proto";

option go_package = "github.com/n-r-w/glyph/pkg/programmatic/v1;programmaticv1";

// ProgrammaticControlService exposes one programmatic control session.
service ProgrammaticControlService {
  // Open exchanges controller requests and Host operation events.
  rpc Open(stream OpenRequest) returns (stream OpenResponse);
}
// OpenRequest carries one controller operation request.
message OpenRequest {
  // The controller-assigned operation identifier.
  string operation_id = 1;
  // The stream content.
  oneof content {
    // The operation request.
    ControllerRequest request = 2;
  }
}
// ControllerRequest carries exactly one Programmatic operation kind.
message ControllerRequest {
  // The operation request.
  oneof request {
    UserRequest user_request = 1;
    glyph.operation.v1.CancelOperation cancel = 2;
    GetRunState get_run_state = 3;
    GetMessages get_messages = 4;
    GetModels get_models = 5;
    SelectModel select_model = 6;
    SelectReasoningChoice select_reasoning_choice = 7;
    CreateSession create_session = 8;
    ListSessions list_sessions = 9;
    ResumeSession resume_session = 10;
    SetSessionName set_session_name = 11;
    GetSessionInfo get_session_info = 12;
    GetSessionEntries get_session_entries = 13;
    GetSessionStats get_session_stats = 14;
    GetSessionTree get_session_tree = 15;
    NavigateSessionTree navigate_session_tree = 16;
    ForkSession fork_session = 17;
    CloneSession clone_session = 18;
    SetEntryLabel set_entry_label = 19;
  }
}
// UserRequest starts an agent run for user text.
message UserRequest {
  // The user request text.
  string text = 1;
}
// GetRunState requests the current run state.
message GetRunState {}
// OpenResponse carries one Host operation event or connection close request.
message OpenResponse {
  // The controller-assigned operation identifier for an operation event.
  string operation_id = 1;
  // The stream content.
  oneof content {
    // The operation event.
    HostEvent event = 2;
    // The Host-requested connection close.
    glyph.operation.v1.CloseConnection close = 3;
  }
}
// HostEvent carries one lifecycle event for a controller operation.
message HostEvent {
  // The lifecycle event.
  oneof event {
    glyph.operation.v1.Accepted accepted = 1;
    glyph.operation.v1.Running running = 2;
    HostProgress progress = 3;
    HostCompleted completed = 4;
    glyph.operation.v1.Canceled canceled = 5;
    glyph.operation.v1.Failed failed = 6;
    glyph.operation.v1.Rejected rejected = 7;
  }
}
// HostProgress carries one operation-specific progress payload.
message HostProgress {
  // The progress payload.
  oneof progress {
    AgentEvent agent_event = 1;
  }
}
// HostCompleted carries one operation-specific completed payload.
message HostCompleted {
  // The completed payload.
  oneof completed {
    UserRequestCompleted user_request = 1;
    glyph.operation.v1.CancelCompleted cancel = 2;
    RunStateResult run_state = 3;
    MessagesResult messages = 4;
    ModelsResult models = 5;
    ModelSelectionResult model_selection = 6;
    SessionInfoResult session_info = 7;
    SessionsResult sessions = 8;
    SessionEntriesResult session_entries = 9;
    SessionStatsResult session_stats = 10;
    SessionTreeResult session_tree = 11;
    SessionTreeNavigationResult session_tree_navigation = 12;
    ForkSessionResult fork_session = 13;
    CloneSessionResult clone_session = 14;
    SetEntryLabelResult set_entry_label = 15;
  }
}
// UserRequestCompleted acknowledges a settled agent run.
message UserRequestCompleted {}
// RunStateResult reports the current agent run state.
message RunStateResult {
  // The current run state.
  RunState state = 1;
  // The operation identifier of the active user request.
  string active_operation_id = 2;
}
// RunState identifies whether an agent run is active.
enum RunState {
  // No run state was provided.
  RUN_STATE_UNSPECIFIED = 0;
  // No agent run is active.
  RUN_STATE_IDLE = 1;
  // An agent run is active.
  RUN_STATE_RUNNING = 2;
}
