version: "3"

# go-task Taskfile
# https://taskfile.dev

dotenv: [".env"]
silent: true

env:
  GOTOOLCHAIN:
    sh: awk '$1 == "go" { print "go" $2; exit }' go.mod

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  tidy:
    desc: "Run go mod tidy"
    cmds:
      - go mod tidy

  lint:
    desc: "Run code linters and vulnerability checks"
    cmds:
      - go tool nilness ./...
      - go tool easyp lint
      - go tool golangci-lint run --config ./.golangci.yml --build-tags=integration
      - go tool ifaceguard --config ifaceguard.cfg
      - go tool govulncheck ./...
      - task: lint-external-plugins

  lint-external-plugins:
    internal: true
    dir: testdata/external-plugins
    cmds:
      - $(cd ../.. && go tool -n golangci-lint) run --config ../../.golangci.yml --build-tags=integration ./...

  test:
    desc: "Run unit tests"
    cmds:
      - go test -race ./...
      - task: test-external-plugins

  test-external-plugins:
    internal: true
    dir: testdata/external-plugins
    cmds:
      - go test -race ./...

  fix:
    desc: "Run go fix the codebase"
    cmds:
      - go fix ./...
      - task: fix-external-plugins

  fix-external-plugins:
    internal: true
    dir: testdata/external-plugins
    cmds:
      - go fix ./...

  fix_dry_run:
    desc: "Show go fix changes without modifying files"
    cmds:
      - go fix -diff ./...
      - task: fix-dry-run-external-plugins

  fix-dry-run-external-plugins:
    internal: true
    dir: testdata/external-plugins
    cmds:
      - go fix -diff ./...

  fmt:
    desc: "Format the codebase"
    cmds:
      - go fmt ./...
      - go tool golangci-lint fmt --config .golangci.yml ./...
      - task: fmt-external-plugins

  fmt-external-plugins:
    internal: true
    dir: testdata/external-plugins
    cmds:
      - go fmt ./...
      - $(cd ../.. && go tool -n golangci-lint) fmt --config ../../.golangci.yml ./...

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  generate:
    desc: Generate code
    cmds:
      - go tool easyp generate
      - go generate ./...

  run:
    desc: "Run Glyph with the standard TUI and extensions"
    interactive: true
    cmds:
      - >-
        '{{default "./bin" .BUILD_ROOT}}/glyph'
        --ui-dir '{{default "./bin" .BUILD_ROOT}}/plugins/ui'
        --ui glyph-tui
        --extension-dir '{{default "./bin" .BUILD_ROOT}}/plugins/extension'

  build:
    desc: "Build the Host and standard plugins"
    cmds:
      - mkdir -p {{default "bin" .BUILD_ROOT}}/plugins/extension {{default "bin" .BUILD_ROOT}}/plugins/ui
      - go build -o {{default "bin" .BUILD_ROOT}}/glyph ./host/cmd/glyph
      - go build -o {{default "bin" .BUILD_ROOT}}/plugins/extension/glyph-tools ./plugins/extension/tools/cmd/glyph-tools
      - go build -o {{default "bin" .BUILD_ROOT}}/plugins/extension/glyph-compaction ./plugins/extension/compaction/cmd/glyph-compaction
      - go build -o {{default "bin" .BUILD_ROOT}}/plugins/ui/glyph-tui ./plugins/ui/tui/cmd/glyph-tui

  # check runs every test once with the race detector and coverage collection, and then checks the coverage threshold.
  #
  # Integration tests of host/internal/app take most of the time. Most of them call t.Setenv to pass settings
  # to plugin processes, which inherit the environment of the test process. Go forbids t.Parallel in such tests,
  # so one test process runs them one after another.
  # Each process has its own environment, so check builds the test binary of this package once and runs its tests
  # in one process per CPU core. On a 24-core machine, this cuts the time of this package from 400 to 30 seconds.
  # Other packages run in parallel through go test.
  check:
    desc: "Run unit and integration tests with race detection and check combined coverage"
    vars:
      COVERAGE_MIN: '{{default "80" .COVERAGE_MIN}}'
    cmds:
      - |
        set -euo pipefail

        work_dir="$(mktemp -d)"
        trap 'rm -rf "$work_dir"' EXIT
        coverage_dir="$work_dir/coverage"
        mkdir "$coverage_dir"

        packages="$(go list ./...)"
        cover_packages="$(printf '%s\n' "$packages" | paste -sd, -)"
        # The integration tests of this package run in separate processes, as the comment of this task explains.
        sharded_dir="host/internal/app"
        sharded_package="$(go list "./$sharded_dir")"

        go test -race -count=1 -coverpkg="$cover_packages" $packages -args -test.gocoverdir="$coverage_dir"
        go test -race -count=1 -tags=integration -coverpkg="$cover_packages" \
          $(printf '%s\n' "$packages" | grep -vx "$sharded_package") -args -test.gocoverdir="$coverage_dir"

        # Distribute the test names round-robin into one regular expression per CPU core.
        go test -race -tags=integration -coverpkg="$cover_packages" -c -o "$work_dir/sharded.test" "./$sharded_dir"
        (cd "$sharded_dir" && "$work_dir/sharded.test" -test.list '.*') | grep '^Test' |
          awk -v shards="$(nproc)" '
            { group[NR % shards] = group[NR % shards] (group[NR % shards] == "" ? "" : "|") $0 }
            END { for (index_ in group) print group[index_] }
          ' >"$work_dir/shards"
        # Run each group in the package directory, as go test does. Each process writes its exit code to a status file,
        # because wait below waits for all processes at once. The log of a group is printed only when the group fails.
        shard=0
        while read -r tests; do
          (
            status=0
            cd "$sharded_dir"
            "$work_dir/sharded.test" -test.count=1 -test.timeout=10m -test.run "^($tests)\$" \
              -test.gocoverdir="$coverage_dir" >"$work_dir/shard-$shard.log" 2>&1 || status=$?
            echo "$status" >"$work_dir/shard-$shard.status"
          ) &
          shard=$((shard + 1))
        done <"$work_dir/shards"
        wait
        failed=0
        for status in "$work_dir"/shard-*.status; do
          if [ "$(cat "$status")" != 0 ]; then
            cat "${status%.status}.log" >&2
            failed=1
          fi
        done
        if [ "$failed" != 0 ]; then
          echo "FAIL $sharded_package" >&2
          exit 1
        fi
        echo "ok   $sharded_package (integration, $shard processes)"

        # The external-plugins fixture is a separate Go module, so go list ./... omits it and coverage excludes it.
        (
          cd testdata/external-plugins
          go test -race ./...
          go test -race -tags=integration ./...
        )

        # Report the total coverage without generated protobuf and mock files.
        go tool covdata textfmt -i="$coverage_dir" -o="$work_dir/coverage.out"
        awk 'NR == 1 || $0 !~ /(\.pb|_mock)\.go:/' "$work_dir/coverage.out" |
          go tool cover -func=/dev/stdin |
          awk -v minimum="{{.COVERAGE_MIN}}" '
            /^total:/ {
              gsub("%", "", $3)
              printf "Coverage: %.1f%%, required: %.1f%%\n", $3, minimum
              exit ($3 + 0 < minimum + 0)
            }
          '
