version: "3"

# go-task Taskfile
# https://taskfile.dev

dotenv: [".env"]
silent: true

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  lint:
    desc: "Run code linters and vulnerability checks"
    cmds:
      - go tool nilness ./...
      - go tool easyp lint
      - go tool golangci-lint run --config ./.golangci.yml --build-tags=integration
      - go tool ifaceguard --config ifaceguard.cfg
      - go tool govulncheck ./...

  test:
    desc: "Run unit tests"
    cmds:
      - go test -race ./...

  itest:
    desc: "Run integration tests"
    cmds:
      # Integration tests start real plugin, terminal, and shell subprocesses. Run packages and tests serially.
      - >-
        go test -race -tags=integration -p 1 -parallel 1
        ./host/internal/app
        ./host/internal/infra/logging
        ./host/internal/infra/persistence
        ./host/internal/infra/persistence/credentials
        ./host/internal/infra/persistence/sessionfilesystem
        ./host/internal/infra/persistence/sessions
        ./host/internal/infra/persistence/settings
        ./host/internal/infra/plugins/extension/catalog
        ./host/internal/infra/plugins/extension/runtime
        ./host/internal/infra/plugins/ui/catalog
        ./host/internal/infra/programmatic/socket
        ./host/internal/infra/providers/openai/codex
        ./host/internal/infra/providers/openai/compatible
        ./internal/testsupport/tui
        ./plugins/extension/tools/internal/controller/extension
        ./plugins/extension/tools/internal/infra/filesystem/project
        ./plugins/extension/tools/internal/infra/process/bash
        ./plugins/ui/tui/internal/app
        ./sdk/plugins/extension/v1
        ./sdk/plugins/ui/v1

  fix:
    desc: "Run go fix"
    cmds:
      - go fix ./...
      - go fmt ./...

  fmt:
    desc: "Format the codebase"
    cmds:
      - go fmt ./...

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  generate:
    desc: Generate code
    cmds:
      - go tool easyp generate
      - go generate ./...

  build:
    desc: "Build the Host and standard plugins"
    cmds:
      - mkdir -p {{default "bin" .BUILD_ROOT}}/plugins/extension {{default "bin" .BUILD_ROOT}}/plugins/ui
      - go build -o {{default "bin" .BUILD_ROOT}}/glyph ./host/cmd/glyph
      - go build -o {{default "bin" .BUILD_ROOT}}/plugins/extension/glyph-tools ./plugins/extension/tools/cmd/glyph-tools
      - go build -o {{default "bin" .BUILD_ROOT}}/plugins/ui/glyph-tui ./plugins/ui/tui/cmd/glyph-tui

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test ./... -coverprofile=coverage.out -v
      - go tool cover -html=coverage.out -o coverage.html
